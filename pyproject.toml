[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisedu_cas"
version = "0.2.0"
description = "Python client for Wisedu (金智教育) CAS unified authentication"
readme = "README.md"
license = "MIT"
authors = [
    {name = "majianyu2007"},
]
keywords = [
    "wisedu",
    "cas",
    "authentication",
    "authserver",
    "totp",
    "2fa",
    "golden-wisdom",
    "campus",
    "fido2",
    "passkey",
    "webauthn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pycryptodome>=3.20.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/majianyu2007/wisedu_cas"
Repository = "https://github.com/majianyu2007/wisedu_cas.git"
Issues = "https://github.com/majianyu2007/wisedu_cas/issues"
Changelog = "https://github.com/majianyu2007/wisedu_cas/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["wisedu_cas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 30
